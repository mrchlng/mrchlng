<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mighty Patch Original</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 35px 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #222;
      text-decoration: none;
      font-size: 14px;
    }

    .product {
  background: white;
  border-radius: 16px;
  padding: 30px;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 40px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
}

    .product-image {
  width: 100%;
  height: 480px;
  object-fit: contain;
  background: #f7f7f7;
  border-radius: 12px;
  display: block;
}

.gallery {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.thumbnails {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.thumbnails img {
  width: 100%;
  height: 90px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: 0.2s;
}

.thumbnails img:hover {
  border-color: #222;
  opacity: 0.85;
}
    

    .details {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .details h1 {
  font-size: 32px;
  line-height: 1.2;
  margin-bottom: 18px;
}

    .description {
  color: #666;
  line-height: 1.8;
  margin-bottom: 28px;
  font-size: 15px;
}

    .shop {
  display: inline-block;
  background: #222;
  color: white;
  text-decoration: none;
  text-align: center;
  padding: 14px 28px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  transition: 0.2s;
}

.shop:hover {
  background: #444;
  transform: translateY(-2px);
}

  

    @media (max-width: 700px) {
  .container {
    padding: 20px 14px;
  }

  .product {
    grid-template-columns: 1fr;
    padding: 18px;
    gap: 25px;
    border-radius: 14px;
  }

  .product-image {
    height: 330px;
  }

  .details h1 {
    font-size: 26px;
  }

  .description {
    font-size: 14px;
    line-height: 1.7;
  }

  .shop {
    width: 100%;
    padding: 15px;
  }

  .thumbnails img {
    height: 75px;
  }
}
</style>
</head>

<body>

<div class="container">

  <a href="women.html" class="back">← Back to Women's Essentials</a>

  <div class="product">

    <div class="gallery">

  <img
    id="mainImage"
    src="Mighty-Patch-Hero-1.jpg"
    alt="Mighty Patch Original"
    class="product-image"
  >

  <div class="thumbnails">

    <img
      src="Mighty-Patch-Hero-1.jpg"
      alt="Mighty Patch image 1"
      onclick="changeImage(this.src)"
    >

    <img
      src="Mighty-Patch-Hero-2.jpg"
      alt="Mighty Patch image 2"
      onclick="changeImage(this.src)"
    >

    <img
      src="Mighty-Patch-Hero-3.jpg"
      alt="Mighty Patch image 3"
      onclick="changeImage(this.src)"
    >

    <img
      src="Mighty-Patch-Hero-4.jpg"
      alt="Mighty Patch image 4"
      onclick="changeImage(this.src)"
    >

  </div>

</div>

    <div class="details">

      <h1>Mighty Patch Original</h1>

      <div class="description">
        #1 Hydrocolloid Acne Patches, Shrinks Zits & Whiteheads in 1 Use, Spot Treatment Pimple Stickers for Face, Korean Skincare
      </div>

      <a
  href="https://www.amazon.com/Mighty-PatchTM-Original-Patch-Hydrocolloid/dp/B0DNR8RF83?th=1&linkCode=ll2&tag=mrchlng-20&linkId=8aff0d92482648ea24d3b8226baf3a44&language=en_US&gaOptInStatus=true&ref_=as_li_ss_tl"
  class="shop"
>
  Shop Now
</a>

    </div>

  </div>

  <script>
  function changeImage(image) {
    document.getElementById("mainImage").src = image;
  }
</script>
  
</body>
</html>
