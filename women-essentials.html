
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Women's Essentials | Discover Your Style</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #F2F7FC;
      color: #24476B;
      min-height: 100vh;
    }

    /* ORIGINAL HEADER */

    .header-banner {
      position: relative;
      width: 100%;
      min-height: 340px;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: #24476B;
    }

    .header-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    .header-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 35, 55, 0.35);
      z-index: 1;
    }

    /* HEADER CONTENT */

    .header-content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 65px 25px 30px;
      color: #FFFFFF;
      text-align: center;
    }

    .header-content h1 {
      font-size: 38px;
      font-weight: bold;
    }

    /* SEARCH BAR */

    .header-search {
      position: absolute;
      top: 18px;
      right: 25px;
      z-index: 3;
      width: 280px;
      max-width: calc(100% - 30px);
    }

    .header-search form {
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border-radius: 25px;
      padding: 3px 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .header-search input {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      padding: 10px 4px;
      font-size: 13px;
      color: #24476B;
    }

    .header-search input::placeholder {
      color: #8292A3;
    }

    .header-search button {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #24476B;
      cursor: pointer;
      padding: 5px;
    }

    .header-search svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* CATEGORIES - MATCH HOMEPAGE */

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 35px 25px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 25px;
      margin-top: 15px;
      align-items: stretch;
    }

    .category-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      text-decoration: none;
      color: #24476B;
      background: #FFFFFF;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(36, 71, 107, 0.08);
      transition: transform 0.3s ease,
                  box-shadow 0.3s ease;
    }

    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 22px rgba(36, 71, 107, 0.15);
    }

    .category-image {
      width: 100%;
      height: 260px;
      background: #FFFFFF;
      overflow: hidden;
      flex-shrink: 0;
    }

    .category-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .category-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 20px 15px;
      text-align: center;
      border-top: 3px solid #F4CF55;
    }

    .category-link {
      display: block;
      width: 100%;
      padding: 10px 5px;
      background: #24476B;
      color: #FFFFFF;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .category-card:hover .category-link {
      background: #F4CF55;
      color: #24476B;
    }

    /* TABLET */

    @media (max-width: 900px) {
      .container {
        padding: 25px 20px;
      }

      .categories {
        gap: 12px;
      }

      .category-image {
        height: 200px;
      }

      .category-info {
        padding: 15px 8px;
      }

      .category-link {
        padding: 9px 5px;
        font-size: 12px;
      }
    }

    /* MOBILE ONLY */

    @media (max-width: 600px) {
      .header-banner {
        height: 180px;
        min-height: 180px;
        overflow: hidden;
      }

      .header-background {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .header-content {
        padding: 55px 15px 20px;
        text-align: center;
      }

      .header-content h1 {
        font-size: 25px;
      }

      .header-search {
        top: 10px;
        right: 12px;
        width: 220px;
      }

      .container {
        padding: 15px 10px;
      }

      .categories {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .category-card {
        border-radius: 8px;
      }

      .category-image {
        height: 120px;
      }

      .category-info {
        padding: 10px 4px;
        border-top-width: 2px;
      }

      .category-link {
        padding: 8px 2px;
        font-size: 9px;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>

<body>

  <!-- ORIGINAL HEADER -->

  <header class="header-banner">

    <img
      src="header.gif.gif"
      alt=""
      class="header-background"
    >

    <div class="header-overlay"></div>

    <div class="header-search">
      <form action="women-essentials.html" method="get">
        <input
          type="search"
          name="q"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="M15.5 15.5L21 21"></path>
          </svg>
        </button>
      </form>
    </div>

    <div class="header-content">
      <h1>Women's Essentials</h1>
    </div>

  </header>

  <!-- CATEGORIES -->

  <main class="container">

    <section class="categories">

      <a href="face.html" class="category-card">
        <div class="category-image">
          <img src="face.png" alt="Face">
        </div>
        <div class="category-info">
          <span class="category-link">FACE</span>
        </div>
      </a>

      <a href="eyes.html" class="category-card">
        <div class="category-image">
          <img src="eyes.png" alt="Eyes">
        </div>
        <div class="category-info">
          <span class="category-link">EYES</span>
        </div>
      </a>

      <a href="lips.html" class="category-card">
        <div class="category-image">
          <img src="lips.png" alt="Lips">
        </div>
        <div class="category-info">
          <span class="category-link">LIPS</span>
        </div>
      </a>

    </section>

  </main>

</body>
</html>
