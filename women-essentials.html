<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Women's Essentials | Discover Your Style</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #F2F7FC;
      color: #24476B;
      min-height: 100vh;
    }

    /* HEADER */

    .header-banner {
      position: relative;
      width: 100%;
      min-height: 340px;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: #24476B;
    }

    .header-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    .header-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 35, 55, 0.35);
      z-index: 1;
    }

    /* HEADER CONTENT */

    .header-content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 65px 25px 30px;
      color: #FFFFFF;
      text-align: center;
    }

    .header-content h1 {
      font-size: 38px;
      font-weight: bold;
    }

    /* SEARCH BAR */

    .header-search {
      position: absolute;
      top: 18px;
      right: 25px;
      z-index: 3;
      width: 280px;
      max-width: calc(100% - 30px);
    }

    .header-search form {
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border-radius: 25px;
      padding: 3px 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .header-search input {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      padding: 10px 4px;
      font-size: 13px;
      color: #24476B;
    }

    .header-search input::placeholder {
      color: #8292A3;
    }

    .header-search button {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #24476B;
      cursor: pointer;
      padding: 5px;
    }

    .header-search svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .header-banner {
        height: 260px;
        min-height: 260px;
      }

      .header-background {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
      }

      .header-content {
        padding: 65px 15px 25px;
        text-align: center;
      }

      .header-content h1 {
        font-size: 28px;
      }

      .header-search {
        top: 12px;
        right: 12px;
        width: 230px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header-banner">

    <img
      src="header.gif.gif"
      alt=""
      class="header-background"
    >

    <div class="header-overlay"></div>

    <!-- SEARCH BAR -->

    <div class="header-search">
      <form action="women-essentials.html" method="get">
        <input
          type="search"
          name="q"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="M15.5 15.5L21 21"></path>
          </svg>
        </button>
      </form>
    </div>

    <!-- TITLE -->

    <div class="header-content">
      <h1>Women's Essentials</h1>
    </div>

  </header>

  <main></main>

</body>
</html>
