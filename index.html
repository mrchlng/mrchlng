<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discover Your Style</title>
  <meta name="description" content="Discover beauty, fashion, and fragrance favorites.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #0754b8;
      --yellow: #ffca05;
      --white: #ffffff;
      --light-blue: #edf5ff;
      --text: #17365d;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--white);
      color: var(--text);
    }

    /* HEADER BANNER */

    .hero-header {
      position: relative;
      min-height: 155px;
      display: flex;
      align-items: center;
      padding: 24px 5%;
      overflow: hidden;
      background: #e8f2ff;
      isolation: isolate;
    }

    .hero-header::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image:
        url("https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=1600&q=85");
      background-size: cover;
      background-position: center 48%;
    }

    .hero-header::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,.96) 0%,
        rgba(238,246,255,.91) 42%,
        rgba(238,246,255,.12) 100%
      );
    }

    .header-content {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand h1 {
      color: var(--blue);
      font-family: Georgia, serif;
      font-size: clamp(25px, 4vw, 43px);
      font-weight: bold;
      line-height: 1.15;
    }

    .brand p {
      color: var(--blue);
      font-size: 11px;
      letter-spacing: 3px;
      margin-top: 9px;
    }

    .brand p span {
      color: var(--yellow);
      font-weight: bold;
    }

    .menu-button {
      border: none;
      background: rgba(255,255,255,.8);
      color: var(--blue);
      font-size: 30px;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    /* SEARCH BAR */

    .search-section {
      padding: 20px 5% 10px;
      background: var(--white);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 12px 18px;
      border: 1px solid #cbdcf5;
      border-radius: 50px;
      background: #fff;
    }

    .search-icon {
      color: var(--blue);
      font-size: 24px;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text);
      background: transparent;
    }

    .search-box input::placeholder {
      color: #8aa3c8;
    }

    /* CATEGORIES */

    .categories {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 5% 20px;
      background: #fff;
    }

    .category-link {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: var(--blue);
      font-size: 17px;
      font-weight: 600;
      padding: 8px 5px;
      position: relative;
    }

    .category-link + .category-link {
      border-left: 1px solid #cbdcf5;
    }

    .category-link.active::after {
      content: "";
      position: absolute;
      bottom: -3px;
      left: 30%;
      width: 40%;
      height: 4px;
      background: var(--yellow);
      border-radius: 10px;
    }

    /* MAIN CONTENT */

    main {
      min-height: 400px;
      padding: 25px 5%;
      background: #fff;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .hero-header {
        min-height: 112px;
        padding: 17px 16px;
      }

      .hero-header::before {
        background-position: center;
      }

      .brand h1 {
        font-size: clamp(21px, 6vw, 30px);
      }

      .brand p {
        font-size: 8px;
        letter-spacing: 1.8px;
        margin-top: 7px;
      }

      .menu-button {
        width: 36px;
        height: 36px;
        font-size: 25px;
      }

      .search-section {
        padding: 14px 16px 6px;
      }

      .search-box {
        padding: 10px 15px;
      }

      .search-box input {
        font-size: 14px;
      }

      .categories {
        padding: 12px 12px 17px;
      }

      .category-link {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header class="hero-header">
    <div class="header-content">

      <div class="brand">
        <h1>Discover Your Style</h1>
        <p>BEAUTY <span>•</span> FASHION <span>•</span> FRAGRANCE</p>
      </div>

      <button class="menu-button" aria-label="Open menu">
        ☰
      </button>

    </div>
  </header>

  <section class="search-section">
    <form class="search-box" id="searchForm">
      <span class="search-icon">⌕</span>
      <input
        type="search"
        id="searchInput"
        placeholder="Search products..."
        aria-label="Search products"
      >
    </form>
  </section>

  <nav class="categories" aria-label="Product categories">
    <a href="#women" class="category-link active">Women</a>
    <a href="#men" class="category-link">Men</a>
    <a href="#fragrance" class="category-link">Fragrance</a>
  </nav>

  <main id="mainContent">
    <!-- Your homepage sections will go here -->
  </main>

  <script>
    const categoryLinks = document.querySelectorAll(".category-link");

    categoryLinks.forEach(link => {
      link.addEventListener("click", () => {
        categoryLinks.forEach(item => {
          item.classList.remove("active");
        });

        link.classList.add("active");
      });
    });

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();

      const query = document.getElementById("searchInput").value.trim();

      if (query) {
        window.location.hash = "search-" + encodeURIComponent(query);
      }
    });
  </script>

</body>
</html>
