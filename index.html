<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discover Your Style</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    /* HERO */

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 16px;
      color: #666;
    }

    /* CATEGORIES */

    .section-title {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .category {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: #222;
      border: 1px solid #eee;
      transition: 0.2s;
    }

    .category:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .category img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .category-name {
      text-align: center;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
    }

    /* FEATURED */

    .featured {
      margin-top: 60px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .product img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 15px;
      text-align: center;
    }

    .product-name {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .shop {
      display: inline-block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 13px;
    }

    .shop:hover {
      background: #444;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .hero h1 {
        font-size: 30px;
      }

      .categories,
      .products {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

<div class="container">

  <!-- HERO -->

  <section class="hero">
    <h1>Discover Your Style</h1>

    <p>
      Curated finds for women, men & fragrance.
    </p>
  </section>


  <!-- CATEGORIES -->

  <section>

    <h2 class="section-title">
      Categories
    </h2>

    <div class="categories">

      <!-- WOMEN -->

      <a href="women.html" class="category">

        <img
          src="WOMEN-IMAGE-URL"
          alt="Women's Essentials"
        >

        <div class="category-name">
          Women's Essentials
        </div>

      </a>


      <!-- MEN -->

      <a href="men.html" class="category">

        <img
          src="MEN-IMAGE-URL"
          alt="Men's Essentials"
        >

        <div class="category-name">
          Men's Essentials
        </div>

      </a>


      <!-- FRAGRANCE -->

      <a href="fragrance.html" class="category">

        <img
          src="FRAGRANCE-IMAGE-URL"
          alt="Fragrance"
        >

        <div class="category-name">
          Fragrance
        </div>

      </a>

    </div>

  </section>


  <!-- FEATURED PRODUCTS -->

  <section class="featured">

    <h2 class="section-title">
      Featured Products
    </h2>

    <div class="products">


      <!-- PRODUCT 1 -->

      <div class="product">

        <img
          src="PRODUCT-1-IMAGE-URL"
          alt="Product 1"
        >

        <div class="product-info">

          <div class="product-name">
            Product Name 1
          </div>

          <a
            href="PRODUCT-1-AFFILIATE-LINK"
            class="shop"
            target="_blank"
          >
            Shop Now
          </a>

        </div>

      </div>


      <!-- PRODUCT 2 -->

      <div class="product">

        <img
          src="PRODUCT-2-IMAGE-URL"
          alt="Product 2"
        >

        <div class="product-info">

          <div class="product-name">
            Product Name 2
          </div>

          <a
            href="PRODUCT-2-AFFILIATE-LINK"
            class="shop"
            target="_blank"
          >
            Shop Now
          </a>

        </div>

      </div>


      <!-- PRODUCT 3 -->

      <div class="product">

        <img
          src="PRODUCT-3-IMAGE-URL"
          alt="Product 3"
        >

        <div class="product-info">

          <div class="product-name">
            Product Name 3
          </div>

          <a
            href="PRODUCT-3-AFFILIATE-LINK"
            class="shop"
            target="_blank"
          >
            Shop Now
          </a>

        </div>

      </div>


    </div>

  </section>

</div>

</body>
</html>
