<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discover Your Style</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #F2F7FC;
      color: #24476B;
    }

    /* HEADER */

    .header-banner {
      position: relative;
      width: 100%;
      min-height: 340px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #24476B;
    }

    .header-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    .header-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(15, 35, 55, 0.35);
    }

    /* SEARCH BAR */

    .header-search {
      position: absolute;
      top: 18px;
      right: 25px;
      z-index: 3;
      width: 280px;
      max-width: calc(100% - 30px);
    }

    .header-search form {
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border-radius: 25px;
      padding: 3px 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .header-search input {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      padding: 10px 4px;
      font-size: 13px;
      color: #24476B;
    }

    .header-search input::placeholder {
      color: #8292A3;
    }

    .header-search button {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #24476B;
      cursor: pointer;
      padding: 5px;
    }

    .header-search svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* HEADER TEXT */

    .header-content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 65px 20px 30px;
      color: #FFFFFF;
    }

    .header-content h1 {
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .header-content p {
      max-width: 650px;
      margin: auto;
      font-size: 16px;
      line-height: 1.8;
    }

    /* MAIN CONTAINER */

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 35px 25px;
    }

    /* CATEGORIES */

    .categories {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 25px;
      margin-top: 15px;
      align-items: stretch;
    }

    .category-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      text-decoration: none;
      color: #24476B;
      background: #FFFFFF;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(36, 71, 107, 0.08);
      transition: transform 0.3s ease,
                  box-shadow 0.3s ease;
    }

    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 22px rgba(36, 71, 107, 0.15);
    }

    .category-image {
      width: 100%;
      height: 260px;
      background: #FFFFFF;
      overflow: hidden;
      flex-shrink: 0;
    }

    .category-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .category-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 20px 15px;
      text-align: center;
      border-top: 3px solid #F4CF55;
    }

    .category-info h2 {
      font-size: 21px;
      line-height: 1.3;
      margin-bottom: 8px;
      color: #24476B;
    }

    .category-link {
      display: inline-block;
      align-self: center;
      margin-top: auto;
      padding: 10px 18px;
      background: #24476B;
      color: #FFFFFF;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      position: relative;
      top: 12px;
      margin-bottom: 12px;
    }

    .category-card:hover .category-link {
      background: #F4CF55;
      color: #24476B;
    }

    /* FEATURED PRODUCTS */

    .featured {
      margin-top: 60px;
      padding: 35px 20px;
      text-align: center;
      background: #FFFFFF;
      border-radius: 12px;
    }

    .featured h2 {
      font-size: 28px;
      color: #24476B;
      margin-bottom: 12px;
    }

    .featured p {
      font-size: 15px;
      color: #526A80;
      line-height: 1.7;
    }

    .featured-line {
      width: 60px;
      height: 4px;
      background: #F4CF55;
      margin: 0 auto 20px;
      border-radius: 3px;
    }

    /* TABLET */

    @media (max-width: 900px) {
      .header-banner {
        min-height: 300px;
      }

      .container {
        padding: 25px 20px;
      }

      .categories {
        gap: 12px;
      }

      .category-image {
        height: 200px;
      }

      .category-info {
        padding: 15px 8px;
      }

      .category-info h2 {
        font-size: 17px;
      }

      .category-link {
        padding: 9px 12px;
        font-size: 12px;
      }
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .header-banner {
        min-height: 260px;
      }

      /* MOBILE HEADER GIF CROP */
      .header-background {
        object-fit: cover;
        object-position: center 45%;
      }

      .header-search {
        top: 12px;
        right: 12px;
        width: 230px;
      }

      .header-content {
        padding: 65px 15px 25px;
      }

      .header-content h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }

      .header-content p {
        font-size: 13px;
        line-height: 1.6;
      }

      .container {
        padding: 15px 10px;
      }

      .categories {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .category-card {
        border-radius: 8px;
      }

      .category-image {
        height: 120px;
      }

      .category-info {
        padding: 12px 5px;
        border-top-width: 2px;
      }

      .category-info h2 {
        font-size: 12px;
        line-height: 1.4;
        margin-bottom: 6px;
        overflow-wrap: anywhere;
      }

      .category-link {
        width: calc(100% - 4px);
        padding: 8px 2px;
        font-size: 10px;
        letter-spacing: 0;
        text-align: center;
      }

      .featured {
        margin-top: 35px;
        padding: 28px 12px;
      }

      .featured h2 {
        font-size: 24px;
      }

      .featured p {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header-banner">

    <img
      src="header.gif.gif"
      alt=""
      class="header-background"
    >

    <div class="header-overlay"></div>

    <div class="header-search">
      <form action="index.html" method="get">
        <input
          type="search"
          name="q"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="M15.5 15.5L21 21"></path>
          </svg>
        </button>
      </form>
    </div>

    <div class="header-content">
      <h1>Discover Your Style</h1>

      <p>
        Explore beauty, skincare, everyday essentials,
        and fragrances curated to complement your personal style.
      </p>
    </div>

  </header>

  <main class="container">

    <!-- CATEGORIES -->

    <section class="categories">

      <a href="womens-essentials.html" class="category-card">
        <div class="category-image">
          <img src="womens-essentials.png" alt="Women's Essentials">
        </div>

        <div class="category-info">
          <h2>Women's Essentials</h2>
          <span class="category-link">EXPLORE</span>
        </div>
      </a>

      <a href="mens-essentials.html" class="category-card">
        <div class="category-image">
          <img src="mens-essentials.png" alt="Men's Essentials">
        </div>

        <div class="category-info">
          <h2>Men's Essentials</h2>
          <span class="category-link">EXPLORE</span>
        </div>
      </a>

      <a href="fragrance.html" class="category-card">
        <div class="category-image">
          <img src="fragrance.png" alt="Fragrance">
        </div>

        <div class="category-info">
          <h2>Fragrance</h2>
          <span class="category-link">EXPLORE</span>
        </div>
      </a>

    </section>

    <!-- FEATURED PRODUCTS -->

    <section class="featured">
      <h2>Featured Products</h2>

      <div class="featured-line"></div>

      <p>
        Discover our handpicked favorites.
        Stay tuned for featured products.
      </p>
    </section>

  </main>

</body>
</html>
