<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discover Your Style</title>
  <meta name="description" content="Discover beauty, fashion, and fragrance favorites.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #0754b8;
      --yellow: #ffca05;
      --white: #ffffff;
      --light-blue: #edf5ff;
      --text: #17365d;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--white);
      color: var(--text);
    }

    /* HEADER BANNER */

    .hero-header {
      position: relative;
      min-height: 155px;
      display: flex;
      align-items: center;
      padding: 24px 5%;
      overflow: hidden;
      background: #e8f2ff;
      isolation: isolate;
    }

    .hero-header::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: url("https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=1600&q=85");
      background-size: cover;
      background-position: center 48%;
    }

    .hero-header::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,.96) 0%,
        rgba(238,246,255,.91) 42%,
        rgba(238,246,255,.12) 100%
      );
    }

    .header-content {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand h1 {
      color: var(--blue);
      font-family: Georgia, serif;
      font-size: clamp(25px, 4vw, 43px);
      font-weight: bold;
      line-height: 1.15;
    }

    .brand p {
      color: var(--blue);
      font-size: 11px;
      letter-spacing: 3px;
      margin-top: 9px;
    }

    .brand p span {
      color: var(--yellow);
      font-weight: bold;
    }

    .menu-button {
      border: none;
      background: rgba(255,255,255,.8);
      color: var(--blue);
      font-size: 30px;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    /* SEARCH BAR */

    .search-section {
      padding: 20px 5% 10px;
      background: var(--white);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 12px 18px;
      border: 1px solid #cbdcf5;
      border-radius: 50px;
      background: #fff;
    }

    .search-icon {
      color: var(--blue);
      font-size: 24px;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text);
      background: transparent;
    }

    .search-box input::placeholder {
      color: #8aa3c8;
    }

    /* NAVIGATION */

    .categories {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 5% 20px;
      background: #fff;
    }

    .category-link {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: var(--blue);
      font-size: 17px;
      font-weight: 600;
      padding: 8px 5px;
      position: relative;
    }

    .category-link + .category-link {
      border-left: 1px solid #cbdcf5;
    }

    .category-link.active::after {
      content: "";
      position: absolute;
      bottom: -3px;
      left: 30%;
      width: 40%;
      height: 4px;
      background: var(--yellow);
      border-radius: 10px;
    }

    /* MAIN CONTENT */

    main {
      min-height: 400px;
      padding: 25px 5%;
      background: #fff;
    }

    /* SHOP BY CATEGORY */

    .shop-categories {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 0 40px;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .section-heading h2 {
      color: var(--blue);
      font-family: Georgia, serif;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .section-heading p {
      color: #64748b;
      font-size: 14px;
    }

    .heading-accent {
      width: 48px;
      height: 4px;
      background: var(--yellow);
      border-radius: 10px;
      margin: 12px auto 0;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .category-card {
      display: block;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: var(--light-blue);
      text-decoration: none;
      color: #fff;
      aspect-ratio: 3 / 4;
      box-shadow: 0 3px 12px rgba(7, 84, 184, 0.10);
    }

    .category-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .category-card:hover img {
      transform: scale(1.05);
    }

    .category-card::after {
      content: "";
      position: absolute;
      inset: 35% 0 0;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(5, 32, 68, 0.78)
      );
    }

    .category-info {
      position: absolute;
      z-index: 1;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 14px 8px;
      text-align: center;
    }

    .category-info h3 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .category-info span {
      display: inline-block;
      background: var(--yellow);
      color: var(--text);
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: bold;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .hero-header {
        min-height: 112px;
        padding: 17px 16px;
      }

      .hero-header::before {
        background-position: center;
      }

      .brand h1 {
        font-size: clamp(21px, 6vw, 30px);
      }

      .brand p {
        font-size: 8px;
        letter-spacing: 1.8px;
        margin-top: 7px;
      }

      .menu-button {
        width: 36px;
        height: 36px;
        font-size: 25px;
      }

      .search-section {
        padding: 14px 16px 6px;
      }

      .search-box {
        padding: 10px 15px;
      }

      .search-box input {
        font-size: 14px;
      }

      .categories {
        padding: 12px 12px 17px;
      }

      .category-link {
        font-size: 14px;
      }

      main {
        padding: 20px 16px;
      }

      .shop-categories {
        padding-bottom: 30px;
      }

      .section-heading {
        margin-bottom: 18px;
      }

      .section-heading h2 {
        font-size: 23px;
      }

      .section-heading p {
        font-size: 12px;
      }

      .category-grid {
        gap: 8px;
      }

      .category-card {
        border-radius: 8px;
      }

      .category-info {
        padding: 10px 2px;
      }

      .category-info h3 {
        font-size: 13px;
        margin-bottom: 6px;
      }

      .category-info span {
        padding: 6px 5px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <header class="hero-header">
    <div class="header-content">
      <div class="brand">
        <h1>Discover Your Style</h1>
        <p>BEAUTY <span>•</span> FASHION <span>•</span> FRAGRANCE</p>
      </div>

      <button class="menu-button" aria-label="Open menu">
        ☰
      </button>
    </div>
  </header>

  <section class="search-section">
    <form class="search-box" id="searchForm">
      <span class="search-icon">⌕</span>
      <input
        type="search"
        id="searchInput"
        placeholder="Search products..."
        aria-label="Search products"
      >
    </form>
  </section>

  <nav class="categories" aria-label="Product navigation">
    <a href="#women" class="category-link active">Women</a>
    <a href="#men" class="category-link">Men</a>
    <a href="#fragrance" class="category-link">Fragrance</a>
  </nav>

  <main id="mainContent">

    <section class="shop-categories" id="shopByCategory">

      <div class="section-heading">
        <h2>Shop by Category</h2>
        <p>Find your favorites and discover your style.</p>
        <div class="heading-accent"></div>
      </div>

      <div class="category-grid">

        <a href="#women" class="category-card" id="women">
          <img
            src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=80"
            alt="Women's fashion and outfit inspiration"
            loading="lazy"
          >
          <div class="category-info">
            <h3>Women</h3>
            <span>EXPLORE</span>
          </div>
        </a>

        <a href="#men" class="category-card" id="men">
          <img
            src="https://images.unsplash.com/photo-1516257984-b1b4d707412e?auto=format&fit=crop&w=600&q=80"
            alt="Men's fashion and modern style"
            loading="lazy"
          >
          <div class="category-info">
            <h3>Men</h3>
            <span>EXPLORE</span>
          </div>
        </a>

        <a href="#fragrance" class="category-card" id="fragrance">
          <img
            src="https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=600&q=80"
            alt="Perfume and fragrance collection"
            loading="lazy"
          >
          <div class="category-info">
            <h3>Fragrance</h3>
            <span>EXPLORE</span>
          </div>
        </a>

      </div>
    </section>

  </main>

  <script>
    const categoryLinks = document.querySelectorAll(
      ".categories .category-link"
    );

    categoryLinks.forEach(link => {
      link.addEventListener("click", () => {
        categoryLinks.forEach(item => {
          item.classList.remove("active");
        });

        link.classList.add("active");
      });
    });

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();

      const query = document.getElementById("searchInput").value.trim();

      if (query) {
        window.location.hash = "search-" + encodeURIComponent(query);
      }
    });
  </script>

</body>
</html>
