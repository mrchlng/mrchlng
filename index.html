<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discover Your Style</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    /* HERO */

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 16px;
      line-height: 1.6;
      color: #666;
    }

    /* SECTION TITLES */

    .section-title {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    /* CATEGORIES */

    .categories {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .category {
      min-width: 0;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: #222;
      border: 1px solid #eee;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .category:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    /* CATEGORY IMAGE - DESKTOP */

    .category img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      object-position: center;
      padding: 0;
      background: #fff;
    }

    .category-name {
      text-align: center;
      padding: 16px 8px;
      font-size: 16px;
      line-height: 1.4;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    /* FEATURED PRODUCTS */

    .featured {
      margin-top: 60px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .product {
      min-width: 0;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .product img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: contain;
      object-position: center;
      padding: 10px;
      background: white;
    }

    .product-info {
      padding: 15px;
      text-align: center;
    }

    .product-name {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    .shop {
      display: inline-block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 13px;
      transition: background 0.2s;
    }

    .shop:hover {
      background: #444;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .container {
        padding: 24px 12px;
      }

      .hero {
        padding: 35px 5px;
      }

      .hero h1 {
        font-size: 28px;
        line-height: 1.3;
      }

      .hero p {
        font-size: 14px;
      }

      .section-title {
        font-size: 21px;
        margin-bottom: 16px;
      }

      .categories,
      .products {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .category,
      .product {
        border-radius: 8px;
      }

      /* CATEGORY IMAGE - MOBILE */

      .category img {
        width: 100%;
        height: 115px;
        object-fit: cover;
        object-position: center;
        padding: 0;
        background: #fff;
      }

      .category-name {
        padding: 10px 3px;
        font-size: 11px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .featured {
        margin-top: 40px;
      }

      .product img {
        height: 135px;
        padding: 5px;
      }

      .product-info {
        padding: 9px 4px;
      }

      .product-name {
        font-size: 11px;
        line-height: 1.4;
        margin-bottom: 9px;
      }

      .shop {
        display: block;
        width: 100%;
        padding: 9px 2px;
        border-radius: 5px;
        font-size: 10px;
        white-space: nowrap;
      }
    }

    /* EXTRA SMALL PHONES */

    @media (max-width: 360px) {
      .container {
        padding-left: 8px;
        padding-right: 8px;
      }

      .categories,
      .products {
        gap: 6px;
      }

      .category img {
        height: 100px;
      }

      .category-name {
        font-size: 10px;
      }

      .product img {
        height: 115px;
      }

      .product-name {
        font-size: 10px;
      }

      .shop {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HERO -->

    <section class="hero">
      <h1>Discover Your Style</h1>

      <p>
        Curated essentials, beauty finds &amp; fragrances worth discovering.
      </p>
    </section>

    <!-- CATEGORIES -->

    <section>
      <h2 class="section-title">Categories</h2>

      <div class="categories">

        <!-- WOMEN -->

        <a href="women-essentials.html" class="category">
          <img
            src="womens-essentials.png"
            alt="Women's Essentials"
          >

          <div class="category-name">
            Women's Essentials
          </div>
        </a>

        <!-- MEN -->

        <a href="men-essentials.html" class="category">
          <img
            src="mens-essentials.png"
            alt="Men's Essentials"
          >

          <div class="category-name">
            Men's Essentials
          </div>
        </a>

        <!-- FRAGRANCE -->

        <a href="fragrance.html" class="category">
          <img
            src="fragrance.png"
            alt="Fragrance"
          >

          <div class="category-name">
            Fragrance
          </div>
        </a>

      </div>
    </section>

    <!-- FEATURED PRODUCTS -->

    <section class="featured">
      <h2 class="section-title">Featured Products</h2>

      <div class="products" id="featured-products">

        <!-- PRODUCT 1 -->

        <div class="product">
          <img
            src="Mighty-Patch-Hero1.jpg"
            alt="Mighty Patch Original"
            loading="lazy"
          >

          <div class="product-info">
            <div class="product-name">
              Mighty Patch Original
            </div>

            <a
              href="https://link.amazon/B0i3S2Nnd"
              class="shop"
              target="_blank"
              rel="noopener noreferrer"
            >
              Shop Now
            </a>
          </div>
        </div>

        <!-- PRODUCT 2 -->

        <div class="product">
          <img
            src="PRODUCT-2-IMAGE-URL"
            alt="Product Name 2"
            loading="lazy"
          >

          <div class="product-info">
            <div class="product-name">
              Product Name 2
            </div>

            <a
              href="PRODUCT-2-AFFILIATE-LINK"
              class="shop"
              target="_blank"
              rel="noopener noreferrer"
            >
              Shop Now
            </a>
          </div>
        </div>

        <!-- PRODUCT 3 -->

        <div class="product">
          <img
            src="PRODUCT-3-IMAGE-URL"
            alt="Product Name 3"
            loading="lazy"
          >

          <div class="product-info">
            <div class="product-name">
              Product Name 3
            </div>

            <a
              href="PRODUCT-3-AFFILIATE-LINK"
              class="shop"
              target="_blank"
              rel="noopener noreferrer"
            >
              Shop Now
            </a>
          </div>
        </div>

      </div>
    </section>

  </div>

  <!-- FEATURED PRODUCT SHUFFLE -->

  <script>
    (function () {
      const container = document.getElementById("featured-products");

      if (!container) return;

      const storageKey = "featuredProductsOrder";
      const products = Array.from(container.children);

      if (products.length < 2) return;

      function shuffle(array) {
        const result = array.slice();

        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));

          [result[i], result[j]] = [result[j], result[i]];
        }

        return result;
      }

      function saveOrder(order) {
        try {
          sessionStorage.setItem(storageKey, JSON.stringify(order));
        } catch (error) {
          // Continue if session storage is unavailable.
        }
      }

      function getSavedOrder() {
        try {
          const saved = JSON.parse(sessionStorage.getItem(storageKey));

          if (
            Array.isArray(saved) &&
            saved.length === products.length &&
            saved.every(
              index =>
                Number.isInteger(index) &&
                index >= 0 &&
                index < products.length
            ) &&
            new Set(saved).size === products.length
          ) {
            return saved;
          }
        } catch (error) {
          // Use a new random order if saved data is unavailable.
        }

        return null;
      }

      function displayOrder(order) {
        order.forEach(index => {
          container.appendChild(products[index]);
        });
      }

      const navigation = performance.getEntriesByType("navigation")[0];

      const isBackNavigation =
        navigation && navigation.type === "back_forward";

      if (isBackNavigation) {
        const savedOrder = getSavedOrder();

        if (savedOrder) {
          displayOrder(savedOrder);
          return;
        }
      }

      const shuffledOrder = shuffle(
        products.map((_, index) => index)
      );

      displayOrder(shuffledOrder);
      saveOrder(shuffledOrder);
    })();
  </script>

</body>
</html>
